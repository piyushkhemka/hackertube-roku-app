name: Validate Roku apps
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and validate catalog app
        run: bash tools/build_catalog_app.sh
      - name: Test compiled catalog navigation and filtering
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package @rokucommunity/brs@0.47.6 brs -r vendor/playlet/build/playlet-lib tests/catalog_navigation.brs vendor/playlet/build/playlet-lib/components/Screens/HomeScreen/HomeScreen.brs | tee /tmp/navigation.log
          grep -q '^PASS:' /tmp/navigation.log
          ! grep -q '^FAIL' /tmp/navigation.log
          npx --yes --package @rokucommunity/brs@0.47.6 brs -r vendor/playlet/build/playlet-lib tests/catalog_filter.brs vendor/playlet/build/playlet-lib/components/HackerTube/HackerTubeCatalogTask.brs | tee /tmp/filter.log
          grep -q '^PASS:' /tmp/filter.log
          ! grep -q '^FAIL' /tmp/filter.log
      - uses: actions/upload-artifact@v4
        with:
          name: hackertube-roku-builds
          path: dist/*
